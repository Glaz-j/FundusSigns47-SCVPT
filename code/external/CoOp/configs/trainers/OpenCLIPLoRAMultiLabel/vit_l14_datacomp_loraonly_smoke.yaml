MODEL:
  BACKBONE:
    NAME: "openclip:ViT-L-14:datacomp_xl_s13b_b90k"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 8
  NUM_WORKERS: 2

INPUT:
  SIZE: (224, 224)
  TRANSFORMS: ("normalize",)

DATASET:
  IMAGE_CACHE_DIR: "/path/to/project/external/CoOp/cache/retinal_image_cache_288_full"
  IMAGE_CACHE_EXT: "jpg"
  MAX_TRAIN_SAMPLES: 256
  MAX_VAL_SAMPLES: 128
  MAX_TEST_SAMPLES: 128

OPTIM:
  NAME: "adamw"
  LR: 0.001
  WEIGHT_DECAY: 0.01
  MAX_EPOCH: 1
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0

TRAIN:
  PRINT_FREQ: 10
  CHECKPOINT_FREQ: 1

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "best_val"
  EVAL_FREQ: 1
  NO_TEST: False

TRAINER:
  LORA:
    RANK: 8
    ALPHA: 16
    DROPOUT: 0.0
    N_BLOCKS: 4
    PREC: "amp"
    ATTN_IN: True
    ATTN_OUT: True
    MLP_FC: True
    MLP_PROJ: True
