MODEL:
  BACKBONE:
    NAME: "openclip:ViT-L-14:datacomp_xl_s13b_b90k"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 1024
  TEST:
    BATCH_SIZE: 1024
  NUM_WORKERS: 0

INPUT:
  SIZE: (224, 224)
  TRANSFORMS: ("normalize",)

DATASET:
  IMAGE_CACHE_DIR: "/path/to/project/external/CoOp/cache/retinal_image_cache_288_v3"
  IMAGE_CACHE_EXT: "jpg"
  FEATURE_CACHE_PATH: "/path/to/project/external/CoOp/cache/openclip_vptdeep_ctx16_fulldepth_tuned_stage2_features_vision3.pt"
  FEATURE_CACHE_BATCH_SIZE: 32
  FEATURE_CACHE_NUM_WORKERS: 4
  FEATURE_CACHE_REBUILD: False

OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 1000
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0

TRAIN:
  PRINT_FREQ: 10
  CHECKPOINT_FREQ: 0

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "last_step"
  NO_TEST: False

TRAINER:
  STAGE2:
    MODE: "mlp"
    RANK: 16
    HIDDEN_DIM: 512
    DROPOUT: 0.1
    PREC: "amp"
    TEXT_TEMPLATE: "a fundus photograph of {}."
  VPT:
    N_CTX: 16
    N_DEEP_LAYERS: -1
    PREC: "amp"
    INIT_STD: 0.02
    DROPOUT: 0.0
    TRAIN_LOGIT_SCALE: True
    TRAIN_PROJ: True
    TRAIN_NORM: True
    FROZEN_MODEL_PATH: "/path/to/project/external/CoOp/output/retinal_vision3/OpenCLIPVPTDeepOnlyMultiLabel/full_100ep_imgcache288_ctx16_fulldepth_tuned_cuda1/model/model-best.pth.tar"
