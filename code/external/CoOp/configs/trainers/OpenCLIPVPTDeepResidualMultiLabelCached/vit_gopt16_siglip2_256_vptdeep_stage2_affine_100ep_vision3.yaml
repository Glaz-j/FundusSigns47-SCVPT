MODEL:
  BACKBONE:
    NAME: "openclip:ViT-gopt-16-SigLIP2-256:webli"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 1024
  TEST:
    BATCH_SIZE: 1024
  NUM_WORKERS: 0

INPUT:
  SIZE: (256, 256)
  TRANSFORMS: ("normalize",)

DATASET:
  IMAGE_CACHE_DIR: "/path/to/project/external/CoOp/cache/retinal_image_cache_288_v3"
  IMAGE_CACHE_EXT: "jpg"
  FEATURE_CACHE_PATH: "/path/to/project/external/CoOp/cache/sig2_g_vptdeep_stage2_features_vision3.pt"
  FEATURE_CACHE_BATCH_SIZE: 4
  FEATURE_CACHE_NUM_WORKERS: 2
  FEATURE_CACHE_REBUILD: False

OPTIM:
  NAME: "sgd"
  LR: 0.01
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0

TRAIN:
  PRINT_FREQ: 10
  CHECKPOINT_FREQ: 0

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "last_step"
  NO_TEST: False

TRAINER:
  STAGE2:
    MODE: "affine"
    RANK: 16
    HIDDEN_DIM: 512
    DROPOUT: 0.0
    PREC: "amp"
    TEXT_TEMPLATE: "a fundus photograph of {}."
  VPT:
    N_CTX: 16
    N_DEEP_LAYERS: -1
    PREC: "amp"
    INIT_STD: 0.02
    DROPOUT: 0.0
    TRAIN_LOGIT_SCALE: True
    TRAIN_PROJ: True
    TRAIN_NORM: True
    FROZEN_MODEL_PATH: "/path/to/project/external/CoOp/output/retinal_vision3/OpenCLIPVPTDeepOnlyMultiLabel/vit_gopt16_siglip2_256_ctx16_fulldepth_tuned_cuda0/model/model-best.pth.tar"
