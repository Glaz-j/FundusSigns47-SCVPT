MODEL:
  BACKBONE:
    NAME: "openclip:ViT-SO400M-14-SigLIP2:webli"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 64
  TEST:
    BATCH_SIZE: 128
  NUM_WORKERS: 0

INPUT:
  SIZE: (224, 224)
  TRANSFORMS: ("normalize",)

DATASET:
  FEATURE_CACHE_PATH: "/path/to/project/external/CoOp/cache/feature_cache_siglip2_so400m14_vision3.pt"
  FEATURE_CACHE_BATCH_SIZE: 16
  FEATURE_CACHE_NUM_WORKERS: 4

OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 1000
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WEIGHT_DECAY: 0.0005

TRAIN:
  PRINT_FREQ: 10
  CHECKPOINT_FREQ: 0

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "last_step"
  EVAL_FREQ: 1
  NO_TEST: False

TRAINER:
  COOP:
    N_CTX: 32
    CSC: False
    CTX_INIT: ""
    PREC: "amp"
    CLASS_TOKEN_POSITION: "end"
