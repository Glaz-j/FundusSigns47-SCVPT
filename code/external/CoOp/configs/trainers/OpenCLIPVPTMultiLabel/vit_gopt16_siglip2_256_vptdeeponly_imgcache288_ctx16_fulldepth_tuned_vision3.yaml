MODEL:
  BACKBONE:
    NAME: "openclip:ViT-gopt-16-SigLIP2-256:webli"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 2
  TEST:
    BATCH_SIZE: 2
  NUM_WORKERS: 4

INPUT:
  SIZE: (256, 256)
  TRANSFORMS: ("normalize",)

DATASET:
  IMAGE_CACHE_DIR: "/path/to/project/external/CoOp/cache/retinal_image_cache_288_v3"
  IMAGE_CACHE_EXT: "jpg"

OPTIM:
  NAME: "adamw"
  LR: 0.001
  WEIGHT_DECAY: 0.01
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 10

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "best_val"
  EVAL_FREQ: 10
  NO_TEST: False

TRAINER:
  VPT:
    N_CTX: 16
    N_DEEP_LAYERS: -1
    PREC: "amp"
    INIT_STD: 0.02
    DROPOUT: 0.0
    TRAIN_LOGIT_SCALE: True
    TRAIN_PROJ: True
    TRAIN_NORM: True
