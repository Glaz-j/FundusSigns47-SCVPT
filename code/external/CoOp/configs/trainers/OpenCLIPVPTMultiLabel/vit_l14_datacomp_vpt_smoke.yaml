MODEL:
  BACKBONE:
    NAME: "openclip:ViT-L-14:datacomp_xl_s13b_b90k"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 8
  NUM_WORKERS: 2

INPUT:
  SIZE: (224, 224)
  TRANSFORMS: ("normalize",)

DATASET:
  MAX_TRAIN_SAMPLES: 128
  MAX_VAL_SAMPLES: 64
  MAX_TEST_SAMPLES: 64

OPTIM:
  NAME: "adamw"
  LR: 0.001
  WEIGHT_DECAY: 0.01
  MAX_EPOCH: 1
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0

TRAIN:
  PRINT_FREQ: 5
  CHECKPOINT_FREQ: 1

TEST:
  EVALUATOR: "MultiLabelClassification"
  FINAL_MODEL: "best_val"
  NO_TEST: False

TRAINER:
  COOP:
    N_CTX: 16
    CSC: False
    CTX_INIT: ""
    PREC: "amp"
    CLASS_TOKEN_POSITION: "end"
  VPT:
    N_CTX: 8
    PREC: "amp"
    INIT_STD: 0.02
    DROPOUT: 0.0
