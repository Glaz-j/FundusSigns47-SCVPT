MODEL:
  BACKBONE:
    NAME: "openclip:ViT-L-14:datacomp_xl_s13b_b90k"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 64
  NUM_WORKERS: 4

INPUT:
  SIZE: (224, 224)
  TRANSFORMS: ("normalize",)

DATASET:
  IMAGE_CACHE_DIR: "/path/to/project/external/CoOp/cache/retinal_image_cache_288_v3"
  IMAGE_CACHE_EXT: "jpg"

OPTIM:
  NAME: "adam"
  LR: 0.001
  MAX_EPOCH: 30
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0
  WEIGHT_DECAY: 0.0001

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 0

TEST:
  EVALUATOR: "MultiLabelClassification"
  EVAL_FREQ: 5
  FINAL_MODEL: "last_step"
  NO_TEST: False

TRAINER:
  STAGE2VIS:
    MODE: "patch_logit"
    HIDDEN_DIM: 256
    ALPHA_INIT: 0.1
    PATCH_RATIO: 0.6
    PREC: "amp"
  VPT:
    N_CTX: 16
    N_DEEP_LAYERS: -1
    PREC: "amp"
    INIT_STD: 0.02
    DROPOUT: 0.0
    TRAIN_LOGIT_SCALE: True
    TRAIN_PROJ: True
    TRAIN_NORM: True
    FROZEN_MODEL_PATH: "/path/to/project/external/CoOp/output/retinal_vision3/OpenCLIPVPTDeepOnlyMultiLabel/full_100ep_imgcache288_ctx16_fulldepth_tuned_cuda1/model/model-best.pth.tar"
