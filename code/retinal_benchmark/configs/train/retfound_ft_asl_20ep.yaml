seed: 42
epochs: 20
batch_size: 8
image_size: 224
num_workers: 4
optimizer: adamw
learning_rate: 0.0001
backbone_learning_rate: 0.00002
head_learning_rate: 0.0005
prompt_learning_rate: 0.0005
lora_learning_rate: 0.0003
layer_decay: 0.8
weight_decay: 0.0001
sampler: weighted
mixed_precision: true
eval_every: 1
early_stopping_patience: 6
loss: asl
asl_gamma_pos: 1.0
asl_gamma_neg: 4.0
asl_clip: 0.05
